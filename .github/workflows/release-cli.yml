name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to npm
        required: true
        default: false
        type: boolean
      dist_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check
      - run: corepack pnpm smoke:generated
      - name: Build package without publishing
        if: ${{ !inputs.publish }}
        run: npm pack --dry-run ./create-ts-fastify-business-starter
      - name: Publish immutable CLI package
        if: ${{ inputs.publish }}
        run: >-
          npm publish ./create-ts-fastify-business-starter
          --access public
          --provenance
          --tag "${{ inputs.dist_tag }}"
